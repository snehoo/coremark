<style>
:root{
  --ink:#2A1B3D;--ink-soft:#4A3A5E;--ink-muted:#8A7A9E;
  --paper:#FBF8F2;--cream:#FBF8F2;--mist:#F0EBF8;
  --blue:#6E47C9;--blue-deep:#5235A0;--blue-tint:#EDE8FA;
  --coral:#F4C73E;--coral-soft:#F7D872;
  --border:#E2DBEF;--border-soft:#EDE8FA;
  --font-sans:'Plus Jakarta Sans',sans-serif;
  --font-serif:'Instrument Serif',serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-sans);background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased;}

/* NAV */
.nav{position:sticky;top:0;z-index:50;background:rgba(251,248,242,0.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border-soft);}
.nav-inner{max-width:1280px;margin:0 auto;padding:0 40px;height:65px;display:flex;align-items:center;justify-content:space-between;gap:24px;}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.mark-sq{background:var(--ink);color:white;font-weight:800;font-size:13px;letter-spacing:0.04em;border-radius:8px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;position:relative;font-family:var(--font-mono);}
.dot{position:absolute;bottom:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--coral);}
.word{font-size:18px;font-weight:800;letter-spacing:-0.025em;color:var(--ink);}
.word .acc{color:var(--blue);}
.nav-links{display:flex;align-items:center;gap:28px;}
.nav-links a{text-decoration:none;font-size:15px;font-weight:500;color:var(--ink-soft);}
.nav-links a:hover{color:var(--ink);}
.nav-cta{background:var(--ink);color:white;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:700;text-decoration:none;}
.nav-cta:hover{background:var(--blue);}

/* MOBILE MENU */
.hamburger{display:none;background:none;border:none;cursor:pointer;padding:6px;color:var(--ink);flex-shrink:0;}
.hamburger svg{display:block;}
.mobile-menu{display:none;position:fixed;top:65px;left:0;right:0;background:var(--cream);border-bottom:1px solid var(--border);z-index:49;padding:8px 0 16px;box-shadow:0 8px 24px rgba(0,0,0,0.08);}
.mobile-menu a{display:block;padding:14px 24px;font-size:16px;font-weight:600;color:var(--ink-soft);text-decoration:none;border-bottom:1px solid var(--border-soft);}
.mobile-menu a:last-child{border-bottom:none;}
.mobile-menu a:hover{color:var(--ink);background:var(--mist);}
.mobile-menu.open{display:block;}

/* COMING SOON HERO */
.soon{min-height:calc(100vh - 65px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:64px 40px;}
.soon .eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:var(--blue);margin-bottom:24px;}
.soon h1{font-size:96px;font-weight:800;letter-spacing:-0.04em;line-height:1.0;margin:0 0 24px;text-wrap:balance;}
.soon h1 em{font-family:var(--font-serif);font-style:italic;font-weight:400;color:var(--ink-soft);}
.soon .lead{font-size:19px;color:var(--ink-soft);line-height:1.6;max-width:520px;margin-bottom:36px;}
.soon .back{background:var(--ink);color:white;padding:16px 28px;border-radius:999px;font-size:16px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:8px;}
.soon .back:hover{background:var(--blue);}

@media(max-width:768px){
  .nav-inner{padding:0 20px;}
  .nav-links{display:none;} .hamburger{display:flex;}
  .soon{padding:48px 24px;}
  .soon h1{font-size:52px;}
}
</style>

<script>
(function(){
  var btn = document.getElementById('hamburger');
  var menu = document.getElementById('mobile-menu');
  if(!btn||!menu) return;
  btn.addEventListener('click', function(){
    var open = menu.classList.toggle('open');
    btn.setAttribute('aria-expanded', open);
  });
  menu.querySelectorAll('a').forEach(function(a){
    a.addEventListener('click', function(){ menu.classList.remove('open'); btn.setAttribute('aria-expanded','false'); });
  });
})();
</script>
